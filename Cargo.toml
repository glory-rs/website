[package]
name = "glory-website"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
homepage = "https://glory.taidge.org"

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glory = { path = "../glory/crates/glory", version = "=0.6.1", default-features = false, features = ["web", "ssr", "hydrate", "i18n", "dsl", "routing"] }
sapid = { path = "../sapid", version = "=0.6.1", features = ["code"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element", "Node", "NodeList", "Location", "Url", "History", "PopStateEvent", "HtmlElement"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
